name: wagering

x-app-environment: &app-environment
    NODE_ENV: production
    PORT: "3000"
    LOG_LEVEL: info
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/wagering
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: wagering
        command: ["postgres", "-c", "max_connections=300"]
        ports:
            - "${POSTGRES_HOST_PORT:-5432}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
            interval: 2s
            timeout: 3s
            retries: 30

    localstack:
        image: localstack/localstack:4
        environment:
            SERVICES: sqs
            AWS_DEFAULT_REGION: us-east-1
        ports:
            - "${LOCALSTACK_HOST_PORT:-4566}:4566"
        volumes:
            - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null 2>&1"]
            interval: 3s
            timeout: 5s
            retries: 40

    migrate:
        build:
            context: .
            target: runtime
        command: ["bun", "run", "db:migrate"]
        environment: *app-environment
        depends_on:
            postgres:
                condition: service_healthy

    app:
        build:
            context: .
            target: runtime
        environment: *app-environment
        deploy:
            replicas: 3
        ports:
            - "${APP_HOST_PORTS:-3000-3002}:3000"
        depends_on:
            postgres:
                condition: service_healthy
            localstack:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

    tests:
        profiles: ["test"]
        build:
            context: .
            target: test
        environment:
            <<: *app-environment
            NODE_ENV: test
        depends_on:
            postgres:
                condition: service_healthy
            localstack:
                condition: service_healthy

volumes:
    postgres-data:
